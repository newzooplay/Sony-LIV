name: sonyliv-auto-update

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sonyliv-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04          # pinned: ubuntu-latest is drifting to 26
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install requests
        run: python -m pip install --upgrade pip requests

      - name: Verify files are present
        run: |
          pwd
          ls -la
          test -f scraper.py || { echo "::error::scraper.py not found at repo root"; exit 1; }

      - name: Selftest (probe only)
        id: selftest
        continue-on-error: true
        run: python scraper.py --selftest --verbose

      - name: Build playlist
        id: build
        run: python scraper.py -o sonyliv.m3u --check --prune --live --verbose

      - name: Report
        if: always()
        run: |
          echo "selftest : ${{ steps.selftest.outcome }}"
          echo "build    : ${{ steps.build.outcome }}"
          if [ -f sonyliv.m3u ]; then
            echo "entries  : $(grep -c '^#EXTINF' sonyliv.m3u)"
            grep '^# Token exp' sonyliv.m3u || true
          fi
          if [ -f sonyliv.debug.json ]; then
            echo "--- debug ---"
            cat sonyliv.debug.json
          fi

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sonyliv.m3u
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "auto: refresh sonyliv token [$(date -u +%FT%TZ)]"
            git push
          fi

      - name: Upload debug on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sonyliv-debug
          path: |
            sonyliv.m3u
            sonyliv.debug.json
          if-no-files-found: ignore
